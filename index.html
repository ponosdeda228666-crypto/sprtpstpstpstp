<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sparta Phalanx — Навигация</title>
<meta name="description" content="Sparta Phalanx — единый узел связи. Все каналы в одном строю.">
<meta name="theme-color" content="#01030a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
/* ============ ПЕРЕМЕННЫЕ ============ */
:root{
  --txt:#e9f1ff;
  --txt-dim:#8ba3c7;
  --txt-mute:#6f88ab;

  --accent:#3b82f6;
  --accent-2:#60a5fa;
  --accent-3:#a8ccff;
  --glow:rgba(59,130,246,.50);

  --ease:cubic-bezier(.2,.8,.2,1);
}

/* ============ БАЗА ============ */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}

body{
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  color:var(--txt);
  min-height:100vh;
  background:#01030a;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

/* ============ ФОН: БАЗОВЫЙ ГРАДИЕНТ ============ */
.bg-base{
  position:fixed;
  inset:-30%;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(45% 40% at 22% 28%, rgba(18,48,120,.55), transparent 70%),
    radial-gradient(40% 38% at 78% 68%, rgba(8,70,140,.42), transparent 70%),
    radial-gradient(42% 40% at 50% 92%, rgba(40,36,120,.36), transparent 70%),
    radial-gradient(50% 45% at 88% 12%, rgba(15,38,95,.42), transparent 70%),
    linear-gradient(155deg,#01030a 0%,#030a1c 38%,#061533 58%,#020711 80%,#01030a 100%);
  animation:bgDrift 46s ease-in-out infinite alternate;
  will-change:transform;
}
@keyframes bgDrift{
  0%  {transform:translate3d(0,0,0) scale(1)}
  50% {transform:translate3d(-3%,2%,0) scale(1.09)}
  100%{transform:translate3d(3%,-2%,0) scale(1.05)}
}

/* ============ ФОН: ЛЁГКОЕ ЗАТЕМНЕНИЕ ============ */
.bg-dim{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
  background:
    radial-gradient(120% 90% at 50% 42%, rgba(0,4,14,.28), rgba(0,3,10,.55) 72%),
    rgba(1,4,12,.22);
}

/* ============ ФОН: СВЕТОВОЙ ПРОХОД ============ */
.bg-sweep{
  position:fixed;
  top:-60%;left:-60%;
  width:220%;height:220%;
  z-index:0;
  pointer-events:none;
  background:linear-gradient(118deg,transparent 44%,rgba(90,150,235,.05) 50%,transparent 56%);
  animation:sweepMove 22s linear infinite;
  will-change:transform;
}
@keyframes sweepMove{
  0%  {transform:translate3d(-18%,-18%,0)}
  100%{transform:translate3d(18%,18%,0)}
}

/* ============ ФОН: СВЕТЯЩИЕСЯ ОРБЫ ============ */
.orbs{
  position:fixed;
  inset:0;
  z-index:0;
  overflow:hidden;
  pointer-events:none;
  mix-blend-mode:screen;
}
.orb{
  position:absolute;
  border-radius:50%;
  filter:blur(90px);
  will-change:transform;
}
.orb--1{
  width:560px;height:560px;top:-16%;left:-12%;
  background:radial-gradient(circle,rgba(22,62,150,.42),transparent 70%);
  animation:float1 22s ease-in-out infinite;
}
.orb--2{
  width:500px;height:500px;bottom:-20%;right:-12%;
  background:radial-gradient(circle,rgba(10,80,155,.32),transparent 70%);
  animation:float2 28s ease-in-out infinite;
}
.orb--3{
  width:440px;height:440px;top:38%;left:52%;
  background:radial-gradient(circle,rgba(42,40,140,.30),transparent 70%);
  animation:float3 34s ease-in-out infinite;
}
.orb--4{
  width:380px;height:380px;top:6%;right:16%;
  background:radial-gradient(circle,rgba(50,110,205,.28),transparent 70%);
  animation:float4 26s ease-in-out infinite;
}
@keyframes float1{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(80px,70px,0) scale(1.12)}}
@keyframes float2{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-90px,-60px,0) scale(1.08)}}
@keyframes float3{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(-70px,80px,0) scale(1.15)}}
@keyframes float4{0%,100%{transform:translate3d(0,0,0) scale(1)}50%{transform:translate3d(60px,-50px,0) scale(1.1)}}

/* ============ ЧАСТИЦЫ ============ */
#particles{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:1;
  display:block;
  pointer-events:none;
  opacity:.9;
}

/* ============ КОНТЕЙНЕР ============ */
.page{
  position:relative;
  z-index:2;
  width:100%;
  max-width:1080px;
  margin:0 auto;
  padding:0 24px 70px;
}

/* ============ HERO ============ */
.hero{
  text-align:center;
  padding:96px 0 0;
}

.hero__badge{
  display:inline-flex;
  align-items:center;
  gap:9px;
  padding:7px 15px;
  border-radius:999px;
  border:1px solid rgba(96,165,250,.14);
  background:rgba(8,18,42,.66);
  backdrop-filter:blur(12px);
  font-size:.66rem;
  font-weight:600;
  letter-spacing:.22em;
  text-transform:uppercase;
  color:#93b4e2;
  margin-bottom:30px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.05);
  animation:riseIn .9s var(--ease) both;
}
.hero__badge b{color:#d4e6ff;font-weight:700}

/* ============ ЗАГОЛОВОК: BOLD И РОВНЫЙ ============ */
h1{
  font-family:'Cinzel','Georgia',serif;
  font-weight:900;
  font-size:clamp(2rem,6.4vw,4.2rem);
  line-height:1.05;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#eaf2ff;
  text-shadow:
    0 0 22px rgba(96,165,250,.45),
    0 0 60px rgba(37,99,235,.35),
    0 6px 26px rgba(0,0,0,.55);
  animation:riseIn .9s var(--ease) .06s both;
}

/* переливающийся разделитель */
.hero__divider{
  width:130px;
  height:2px;
  margin:26px auto 0;
  border-radius:2px;
  background:linear-gradient(90deg,transparent,#3b82f6,#7fb4ff,#3b82f6,transparent);
  background-size:200% 100%;
  box-shadow:0 0 18px rgba(59,130,246,.75);
  animation:dividerShine 4.5s linear infinite;
}
@keyframes dividerShine{
  0%  {background-position:200% 0}
  100%{background-position:-200% 0}
}

.hero__sub{
  max-width:560px;
  margin:24px auto 0;
  font-size:1.02rem;
  line-height:1.72;
  color:var(--txt-dim);
  animation:riseIn .9s var(--ease) .16s both;
}

.hero__status{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin-top:30px;
  padding:9px 18px;
  border-radius:999px;
  border:1px solid rgba(96,165,250,.14);
  background:rgba(7,16,38,.66);
  backdrop-filter:blur(12px);
  font-size:.7rem;
  font-weight:600;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:#9fbcdd;
  animation:riseIn .9s var(--ease) .24s both;
}
.hero__status i{
  width:7px;height:7px;
  border-radius:50%;
  background:#4ade80;
  box-shadow:0 0 0 0 rgba(74,222,128,.7);
  animation:blip 2.2s ease-out infinite;
}
@keyframes blip{
  0%  {box-shadow:0 0 0 0 rgba(74,222,128,.65)}
  70% {box-shadow:0 0 0 9px rgba(74,222,128,0)}
  100%{box-shadow:0 0 0 0 rgba(74,222,128,0)}
}

@keyframes riseIn{
  from{opacity:0;transform:translateY(16px)}
  to  {opacity:1;transform:none}
}

/* ============ КНОПКИ ============ */
.actions{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:18px;
  max-width:880px;
  margin:64px auto 0;
}

.action-card{
  position:relative;
  display:flex;
  align-items:center;
  gap:16px;
  flex:1 1 330px;
  max-width:410px;
  padding:22px 22px;
  border-radius:20px;
  text-decoration:none;
  color:inherit;
  overflow:hidden;
  isolation:isolate;
  background:linear-gradient(155deg, rgba(14,30,62,.78), rgba(4,10,24,.85));
  border:1px solid rgba(80,130,210,.20);
  backdrop-filter:blur(12px);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.05),
    0 18px 44px -26px rgba(2,12,40,.95);
  transition:
    transform .35s var(--ease),
    border-color .35s var(--ease),
    box-shadow .35s var(--ease),
    background .35s var(--ease);
  animation:
    cardIn .8s var(--ease) both,
    cardPulse 6.5s ease-in-out infinite;
  animation-delay:var(--d,0s), var(--d,0s);
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(20px)}
  to  {opacity:1;transform:none}
}
@keyframes cardPulse{
  0%,100%{filter:drop-shadow(0 0 0 rgba(59,130,246,0))}
  50%    {filter:drop-shadow(0 0 16px rgba(59,130,246,.28))}
}

/* верхняя подсветка */
.action-card::before{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:inherit;
  background:radial-gradient(460px 150px at 20% 0%, rgba(80,140,235,.20), transparent 72%);
  opacity:0;
  transition:opacity .35s var(--ease);
}

/* бегущий блик */
.action-card::after{
  content:"";
  position:absolute;
  inset:0;
  z-index:-1;
  border-radius:inherit;
  background:linear-gradient(112deg,transparent 34%,rgba(150,195,255,.13) 50%,transparent 66%);
  transform:translateX(-140%);
  transition:transform .9s var(--ease);
  pointer-events:none;
}

.action-card:hover{
  transform:translateY(-5px);
  border-color:rgba(110,165,240,.42);
  background:linear-gradient(155deg, rgba(22,44,88,.85), rgba(6,14,32,.86));
  box-shadow:
    0 26px 56px -24px rgba(4,22,60,.98),
    0 0 0 1px rgba(80,140,235,.16),
    0 0 46px -12px var(--glow);
}
.action-card:hover::before{opacity:1}
.action-card:hover::after{transform:translateX(140%)}
.action-card:active{transform:translateY(-2px)}

.action-card:focus-visible{
  outline:2px solid #6ea6f5;
  outline-offset:4px;
}

/* иконка */
.action-card__icon{
  flex:0 0 auto;
  width:56px;
  height:56px;
  border-radius:16px;
  display:grid;
  place-items:center;
  color:#8fbcf5;
  background:linear-gradient(160deg, rgba(45,105,205,.32), rgba(8,20,44,.94));
  border:1px solid rgba(90,145,225,.26);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.09);
  transition:
    color .35s var(--ease),
    border-color .35s var(--ease),
    box-shadow .35s var(--ease),
    transform .35s var(--ease);
}
.action-card__icon svg{width:25px;height:25px}
.action-card:hover .action-card__icon{
  color:#e4efff;
  border-color:rgba(130,180,245,.58);
  transform:scale(1.06);
  box-shadow:
    0 0 26px -4px var(--glow),
    inset 0 1px 0 rgba(255,255,255,.18);
}

/* текст */
.action-card__body{
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:5px;
}
.action-card__title{
  display:flex;
  align-items:center;
  gap:8px;
  font-size:1.06rem;
  font-weight:600;
  letter-spacing:.015em;
  color:#eaf2ff;
  flex-wrap: wrap; /* Чтобы тег переносился, если не влезает */
}
.action-card__desc{
  font-size:.8rem;
  line-height:1.42;
  color:var(--txt-dim);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

/* бейдж */
.tag{
  flex:0 0 auto;
  font-style:normal;
  font-size:.58rem;
  font-weight:700;
  letter-spacing:.11em;
  text-transform:uppercase;
  padding:2px 6px;
  border-radius:5px;
  color:#a9ccf7;
  background:rgba(45,105,205,.20);
  border:1px solid rgba(90,145,225,.34);
  transform:translateY(-1px);
}

/* стрелка */
.action-card__arrow{
  flex:0 0 auto;
  width:19px;
  height:19px;
  margin-left:auto;
  color:#6e97cc;
  opacity:.35;
  transition:opacity .35s var(--ease), transform .35s var(--ease), color .35s var(--ease);
}
.action-card:hover .action-card__arrow{
  opacity:1;
  color:var(--accent-3);
  transform:translateX(5px);
}

/* ============ ФУТЕР ============ */
.footer{
  margin-top:96px;
  padding-top:26px;
  border-top:1px solid rgba(80,135,220,.12);
  display:flex;
  flex-wrap:wrap;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  font-size:.755rem;
  letter-spacing:.05em;
  color:var(--txt-mute);
}
.footer__brand{
  display:flex;
  align-items:center;
  gap:10px;
  font-weight:600;
  color:#7fa0c9;
}
.footer__brand svg{
  width:15px;height:15px;
  color:var(--accent-2);
  filter:drop-shadow(0 0 8px rgba(96,165,250,.7));
}

/* ============ ИКОНКИ ============ */
.sprite{display:none}
.icon{
  width:1em;height:1em;
  fill:none;
  stroke:currentColor;
  stroke-width:2;
  stroke-linecap:round;
  stroke-linejoin:round;
}

/* ============ СКРОЛЛБАР / ВЫДЕЛЕНИЕ ============ */
::selection{background:rgba(59,130,246,.40);color:#fff}

::-webkit-scrollbar{width:10px}
::-webkit-scrollbar-track{background:#01030a}
::-webkit-scrollbar-thumb{
  background:linear-gradient(#152a54,#0a1a38);
  border-radius:10px;
  border:2px solid #01030a;
}
::-webkit-scrollbar-thumb:hover{background:linear-gradient(#1e3a6e,#0f2447)}

/* ============ АДАПТИВ ============ */
@media (max-width:720px){
  .page{padding:0 16px 56px}
  .hero{padding-top:64px}
  .hero__badge{margin-bottom:26px;font-size:.6rem;letter-spacing:.18em}
  .hero__sub{font-size:.95rem}
  .actions{margin-top:46px;flex-direction:column;align-items:stretch}
  .action-card{max-width:none;flex:1 1 auto}
  .action-card__desc{white-space:normal}
  .footer{flex-direction:column;align-items:flex-start;margin-top:64px}
  .orb--1,.orb--2{width:380px;height:380px}
  .orb--3,.orb--4{width:300px;height:300px}
}

/* ============ МЕНЬШЕ ДВИЖЕНИЯ ============ */
@media (prefers-reduced-motion: reduce){
  *,
  *::before,
  *::after{
    animation-duration:.001ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.001ms !important;
  }
}
</style>
</head>
<body>

<!-- ================= ФОН ================= -->
<div class="bg-base" aria-hidden="true"></div>
<div class="bg-dim" aria-hidden="true"></div>
<div class="bg-sweep" aria-hidden="true"></div>

<div class="orbs" aria-hidden="true">
  <span class="orb orb--1"></span>
  <span class="orb orb--2"></span>
  <span class="orb orb--3"></span>
  <span class="orb orb--4"></span>
</div>

<!-- ================= ЧАСТИЦЫ ================= -->
<canvas id="particles" aria-hidden="true"></canvas>

<!-- ================= КОНТЕНТ ================= -->
<div class="page">

  <header class="hero">
    <div class="hero__badge">актуальный переходник</div>

    <h1>Sparta Phalanx</h1>

    <div class="hero__divider" aria-hidden="true"></div>

    <p class="hero__sub">
      Единый узел связи. Все наши каналы, ресурсы и точки входа —
      собраны здесь в одном строю.
    </p>

    <div class="hero__status">
      <i aria-hidden="true"></i>
      бот активен
    </div>
  </header>

  <main>
    <div class="actions">

      <!-- ИСПРАВЛЕННАЯ КНОПКА С ССЫЛКОЙ -->
      <a class="action-card" href="https://t.me/SPTROBOT" target="_blank" rel="noopener noreferrer" style="--d:.10s">
        <span class="action-card__icon">
          <svg class="icon" aria-hidden="true"><use href="#i-send"/></svg>
        </span>
        <span class="action-card__body">
          <span class="action-card__title">
            БОТ ТИМЫ <em class="tag">SPARTA PHALANX</em>
          </span>
          <span class="action-card__desc">все необходимое</span>
        </span>
        <svg class="icon action-card__arrow" aria-hidden="true"><use href="#i-arrow"/></svg>
      </a>

    </div>
  </main>

  <footer class="footer">
    <div class="footer__brand">
      <svg class="icon" aria-hidden="true"><use href="#i-shield"/></svg>
      Sparta Phalanx
    </div>
  </footer>

</div>

<!-- ================= СПРАЙТ ИКОНОК ================= -->
<svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
  <symbol id="i-shield" viewBox="0 0 24 24">
    <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    <path d="M12 7v9"/>
  </symbol>
  <symbol id="i-arrow" viewBox="0 0 24 24">
    <path d="M5 12h14M12 5l7 7-7 7"/>
  </symbol>
  <symbol id="i-send" viewBox="0 0 24 24">
    <path d="M22 2L11 13"/>
    <path d="M22 2l-7 20-4-9-9-4 20-7z"/>
  </symbol>
</svg>

<!-- ================= СКРИПТ ЧАСТИЦ ================= -->
<script>
(function(){
  'use strict';

  var canvas = document.getElementById('particles');
  if(!canvas) return;

  var ctx = canvas.getContext('2d', { alpha: true });
  var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var W = 0, H = 0, dpr = 1;
  var particles = [];
  var mouse = { x: -9999, y: -9999, active: false };

  function makeSprite(c1, c2, c3){
    var s = document.createElement('canvas');
    s.width = 64;
    s.height = 64;
    var sx = s.getContext('2d');
    var g = sx.createRadialGradient(32, 32, 0, 32, 32, 32);
    g.addColorStop(0, c1);
    g.addColorStop(0.28, c2);
    g.addColorStop(1, c3);
    sx.fillStyle = g;
    sx.fillRect(0, 0, 64, 64);
    return s;
  }

  var sprites = [
    makeSprite('rgba(220,235,255,.95)', 'rgba(110,170,245,.50)', 'rgba(30,75,180,0)'),
    makeSprite('rgba(180,215,255,.90)', 'rgba(70,135,230,.44)',  'rgba(20,60,170,0)'),
    makeSprite('rgba(245,250,255,.85)', 'rgba(140,190,245,.38)', 'rgba(40,95,200,0)'),
    makeSprite('rgba(165,205,245,.90)', 'rgba(95,155,230,.40)',  'rgba(25,70,180,0)')
  ];

  function createParticle(){
    var size = 3 + Math.random() * 12;
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 0.30,
      vy: (Math.random() - 0.5) * 0.30,
      size: size,
      alpha: 0.12 + Math.random() * 0.34,
      phase: Math.random() * Math.PI * 2,
      speed: 0.35 + Math.random() * 1.25,
      sprite: (Math.random() * sprites.length) | 0,
      depth: 0.35 + Math.random() * 0.65
    };
  }

  function targetCount(){
    var area = W * H;
    var n = Math.round(area / 8200);
    if (n < 45) n = 45;
    if (n > 210) n = 210;
    return n;
  }

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width  = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    canvas.style.width  = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    var need = targetCount();

    if (particles.length > need){
      particles.length = need;
    }
    while (particles.length < need){
      particles.push(createParticle());
    }

    for (var i = 0; i < particles.length; i++){
      var p = particles[i];
      if (p.x < 0 || p.x > W || p.y < 0 || p.y > H){
        p.x = Math.random() * W;
        p.y = Math.random() * H;
      }
    }
  }

  var LINK_DIST = 120;
  var LINK_DIST_SQ = LINK_DIST * LINK_DIST;
  var MOUSE_R = 140;
  var MOUSE_R_SQ = MOUSE_R * MOUSE_R;

  function step(t){
    ctx.clearRect(0, 0, W, H);

    var i, j, p, a, b;

    for (i = 0; i < particles.length; i++){
      p = particles[i];

      if (!reduceMotion){
        p.x += p.vx * p.depth * 2.2;
        p.y += p.vy * p.depth * 2.2;
      }

      if (mouse.active){
        var dx = p.x - mouse.x;
        var dy = p.y - mouse.y;
        var d2 = dx * dx + dy * dy;
        if (d2 < MOUSE_R_SQ && d2 > 0.01){
          var d = Math.sqrt(d2);
          var f = (1 - d / MOUSE_R) * 1.1;
          p.x += (dx / d) * f;
          p.y += (dy / d) * f;
        }
      }

      if (p.x < -60) p.x = W + 60;
      else if (p.x > W + 60) p.x = -60;
      if (p.y < -60) p.y = H + 60;
      else if (p.y > H + 60) p.y = -60;
    }

    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1;

    for (i = 0; i < particles.length; i++){
      a = particles[i];
      for (j = i + 1; j < particles.length; j++){
        b = particles[j];
        var lx = a.x - b.x;
        var ly = a.y - b.y;
        var l2 = lx * lx + ly * ly;
        if (l2 < LINK_DIST_SQ){
          var dist = Math.sqrt(l2);
          var alpha = (1 - dist / LINK_DIST) * 0.15;
          if (alpha > 0.012){
            ctx.strokeStyle = 'rgba(95,155,235,' + alpha.toFixed(3) + ')';
            ctx.beginPath();
            ctx.moveTo(a.x, a.y);
            ctx.lineTo(b.x, b.y);
            ctx.stroke();
          }
        }
      }
    }

    var time = t * 0.001;

    for (i = 0; i < particles.length; i++){
      p = particles[i];

      var twinkle = 0.62 + 0.38 * Math.sin(time * p.speed + p.phase);
      var alpha = p.alpha * twinkle;
      if (alpha <= 0.012) continue;

      ctx.globalAlpha = alpha;

      var r = p.size * 2.3;
      var spr = sprites[p.sprite];
      ctx.drawImage(spr, p.x - r, p.y - r, r * 2, r * 2);
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
  }

  var rafId = null;

  function loop(t){
    step(t);
    rafId = requestAnimationFrame(loop);
  }

  window.addEventListener('resize', resize);

  window.addEventListener('pointermove', function(e){
    mouse.x = e.clientX;
    mouse.y = e.clientY;
    mouse.active = true;
  }, { passive: true });

  document.addEventListener('mouseleave', function(){
    mouse.active = false;
  });

  window.addEventListener('blur', function(){
    mouse.active = false;
  });

  resize();

  if (reduceMotion){
    step(0);
  } else {
    rafId = requestAnimationFrame(loop);
  }
})();
</script>

</body>
</html>
